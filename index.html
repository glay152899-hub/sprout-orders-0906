<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0A7C78" />
  <title>Sprout 📱 小豆苗訂單助手 (Firebase RTDB 實時同步版)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // [V2.8.1] 主色：接近蒂芙尼藍的青綠色（原本的 emerald 綠色整組換掉）。
    // 300 / 500 是蒂芙尼藍本色（#81D8D0 / #0ABAB5），太亮，只用在淡色底、邊框、深色底上的字。
    // 600 以上才用在「白字按鈕、標題列、金額文字」，對比度都在 4.5:1 以上，不影響閱讀。
    // 沒有載入 Tailwind（例如 Claude 的檔案預覽環境）時就略過，避免出現「tailwind is not defined」
    if (window.tailwind) tailwind.config = {
      theme: {
        extend: {
          colors: {
            emerald: {
              50: '#F0FBFA', 100: '#D6F4F1', 200: '#ADE9E4', 300: '#81D8D0', 400: '#3FC4BC',
              500: '#0ABAB5', 600: '#0A7C78', 700: '#0A6864', 800: '#0B5350', 900: '#0C4240', 950: '#062A29'
            }
          }
        }
      }
    };
  </script>
  <!-- React & ReactDOM Core Libraries -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JIT JSX Compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- SheetJS (xlsx) Library for Import/Export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Firebase App & Realtime Database (Compat SDKs for CDN Single HTML) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Global CSS: Hide scrollbar while maintaining scroll functionality */
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-emerald-600 selection:text-white min-h-screen flex flex-col">
  <!-- React Mounting Root -->
  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel" src="src/config.js"></script>
  <script type="text/babel" src="src/icons.js"></script>
  <script type="text/babel" src="src/error-boundary.js"></script>
  <script type="text/babel" src="src/utils.js"></script>
  <script type="text/babel" src="src/utils-export.js"></script>
  <script type="text/babel" src="src/ui-shared.js"></script>
  <script type="text/babel" src="src/auth.js"></script>
  <script type="text/babel" src="src/tab-orderList.js"></script>
  <script type="text/babel" src="src/tab-more.js"></script>
  <script type="text/babel" src="src/modal-product.js"></script>
  <script type="text/babel" src="src/tab-tally.js"></script>
  <script type="text/babel" src="src/tab-products.js"></script>
  <script type="text/babel" src="src/app-shell.js"></script>
  <script type="text/babel">
    // Mount Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <AuthGate />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
