    // ==========================================
    // Error Boundary Component
    // ==========================================
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }

      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }

      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught error:", error, errorInfo);
      }

      handleReset = () => {
        window.location.reload();
      };

      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center bg-red-50 p-4">
              <div className="bg-white p-6 rounded-2xl shadow-xl max-w-md w-full text-center border border-red-100">
                <div className="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">

                </div>
                <h2 className="text-xl font-bold text-gray-800 mb-2">發生未預期的錯誤</h2>
                <p className="text-sm text-gray-500 mb-4">
                  若持續出現，請檢查網路連線、登入狀態，以及 Firebase 的規則設定。
                </p>
                <div className="bg-gray-50 p-3 rounded-lg text-left font-mono text-xs text-red-500 overflow-auto max-h-28 mb-6 border border-gray-200">
                  {this.state.error?.toString()}
                </div>
                <button
                  onClick={this.handleReset}
                  className="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-xl shadow-md transition flex items-center justify-center gap-2"
                >
                  <IconRefreshCw size={18} />
                  重新整理網頁
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const formatDate = (dateStr) => {
      if (!dateStr) return '無紀錄';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return '無紀錄';
      return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
    };

    const inferCategoryFromTitle = (title, currentCat = '') => {
      if (currentCat && currentCat !== '未分類') return currentCat;
      if (!title) return '未分類';
      const t = title.toLowerCase();
      const hasAny = (words) => words.some(w => t.includes(w));

      // [V2.1.1] 先判斷「明確的衣物字眼」，避免「連帽上衣」「吊帶褲」「包屁衣」被 帽/帶/包 誤判
      if (hasAny(['衣', '褲', '裙', '外套', '洋裝', 't恤', '背心', '連身', '套裝', '斗篷', '披風', '睡袍', '罩衫'])) {
        return '服飾';
      }
      if (hasAny(['圍兜', '奶嘴', '固齒', '咬咬', '奶瓶', '餐具', '口水巾', '寶', '童', '嬰'])) {
        return '母嬰用品';
      }
      if (hasAny(['包', '皮夾', '帽', '飾', '襪', '鞋', '帶'])) {
        return '鞋包配飾';
      }
      return '服飾';
    };

    const getStagnantInfo = (prod) => {
      if (prod.status === 'archived') {
        return {
          type: 'archived',
          label: '📦 已下架歸檔',
          color: 'bg-slate-100 text-slate-500 border-slate-200',
          days: 0,
          isAlert: false
        };
      }

      const refDateStr = prod.lastOrderedAt || prod.createdAt;
      if (!refDateStr) {
        return {
          type: 'none',
          label: '⚪ 無銷售紀錄',
          color: 'bg-slate-100 text-slate-600 border-slate-200',
          days: 0,
          isAlert: false
        };
      }

      const refDate = new Date(refDateStr);
      const diffTime = Math.max(0, new Date() - refDate);
      const days = Math.floor(diffTime / (1000 * 60 * 60 * 24));

      if (days >= 365) {
        return {
          type: 'critical',
          label: `⛔ 1年+ 未銷售 (${days}天)`,
          color: 'bg-red-50 text-red-700 border-red-200 font-bold',
          days,
          isAlert: true
        };
      }
      if (days >= 180) {
        return {
          type: 'warning',
          label: `⚠️ 半年+ 未銷售 (${days}天)`,
          color: 'bg-amber-50 text-amber-800 border-amber-200 font-bold',
          days,
          isAlert: true
        };
      }
      if (!prod.lastOrderedAt) {
        return {
          type: 'unsold',
          label: `⚪ 上架 ${days} 天未銷售`,
          color: 'bg-slate-100 text-slate-600 border-slate-200',
          days,
          isAlert: false
        };
      }

      return {
        type: 'active',
        label: `🟢 ${days} 天前下單`,
        color: 'bg-emerald-50 text-emerald-700 border-emerald-200',
        days,
        isAlert: false
      };
    };

    const findSmartValue = (row, keyType) => {
      const keys = Object.keys(row);
      for (const k of keys) {
        const cleanK = k.trim().toLowerCase();
        if (keyType === 'sku' && (cleanK.includes('sku') || cleanK.includes('款號') || cleanK.includes('編號') || cleanK.includes('代碼'))) {
          return row[k];
        }
        if (keyType === 'title' && (cleanK.includes('名') || cleanK.includes('標題') || cleanK.includes('title') || cleanK.includes('品名') || cleanK.includes('商品') || cleanK.includes('品項'))) {
          return row[k];
        }
        if (keyType === 'price' && !cleanK.includes('總') && (cleanK.includes('價') || cleanK.includes('price') || cleanK.includes('金額'))) {
          return row[k];
        }
        if (keyType === 'sizes' && (cleanK.includes('尺') || cleanK.includes('尺寸') || cleanK.includes('size'))) {
          return row[k];
        }
        if (keyType === 'colors' && (cleanK.includes('色') || cleanK.includes('顏色') || cleanK.includes('color'))) {
          return row[k];
        }
        if (keyType === 'category' && (cleanK.includes('類') || cleanK.includes('分類') || cleanK.includes('category'))) {
          return row[k];
        }
        if (keyType === 'note' && (cleanK.includes('備註') || cleanK.includes('note') || cleanK.includes('說明'))) {
          return row[k];
        }
      }
      return '';
    };

    const parseItemDetails = (title) => {
      let baseName = title;
      let color = '預設';
      let size = 'F';

      const bracketMatch = title.match(/[【\[(](.*?)[】\])]/);
      if (bracketMatch) {
        const content = bracketMatch[1];
        baseName = title.replace(bracketMatch[0], '').trim();
        if (content.includes('/')) {
          const parts = content.split('/');
          color = parts[0].trim() || color;
          size = parts[1].trim() || size;
        } else {
          color = content.trim();
        }
      } else {
        const hyphenMatch = title.match(/[-_\s]+([^\s-_\d]+)?(\d+|S|M|L|XL|XXL|F)?$/i);
        if (hyphenMatch) {
          if (hyphenMatch[1]) color = hyphenMatch[1].trim();
          if (hyphenMatch[2]) size = hyphenMatch[2].trim();
          baseName = title.substring(0, hyphenMatch.index).trim();
        }
      }
      return { baseName: baseName || title, color, size };
    };

    // ==========================================
    // [V2.1.1] 商品庫 Excel 智慧匯入（移植自獨立測試版）
    // ==========================================
    // Excel 裡常見的「空值」字串（例如備註欄寫 null）
    const cleanImportCell = (val) => {
      const s = String(val ?? '').trim();
      return ['null', 'undefined', 'nan'].includes(s.toLowerCase()) ? '' : s;
    };

    const splitImportList = (s) =>
      s ? s.split(/[,，、]+/).map(x => x.trim()).filter(Boolean) : [];

    const sortSizes = (sizeArr) => {
      const standardOrder = ['XS', 'S', 'M', 'L', 'XL', '2XL', '3XL', '4XL', 'F', 'FREE'];
      return [...sizeArr].sort((a, b) => {
        const numA = parseFloat(a);
        const numB = parseFloat(b);
        if (!isNaN(numA) && !isNaN(numB)) return numA - numB;

        const idxA = standardOrder.indexOf(a.toUpperCase());
        const idxB = standardOrder.indexOf(b.toUpperCase());
        if (idxA !== -1 && idxB !== -1) return idxA - idxB;
        if (idxA !== -1) return -1;
        if (idxB !== -1) return 1;
        return a.localeCompare(b);
      });
    };

    const DEFAULT_IMPORT_OPTIONS = {
      autoExtract: true,   // 智慧拆解名稱（-藏青90 → 顏色藏青 / 尺寸90）
      smartSort: true,     // 尺寸智慧排序
      autoCategory: true,  // 關鍵字分類推斷
      groupBySeries: true, // 歸納同系列規格（同品名合併成一個商品）
      skipExisting: true,  // 略過商品庫已有的同名商品，避免重複匯入
      importNote: false    // 匯入備註欄（訂購單格式的備註是「訂單備註」，預設不匯入）
    };

    // 把 Excel 的原始列 → 預覽 / 匯入用的商品清單（純函式，不碰資料庫）
    const buildImportProducts = (rawRows, opts, existingProducts) => {
      const tempItems = [];

      rawRows.forEach((row) => {
        const rawTitle = cleanImportCell(findSmartValue(row, 'title'));
        if (!rawTitle) return;

        let name = rawTitle;
        let sizes = cleanImportCell(findSmartValue(row, 'sizes'));
        let colors = cleanImportCell(findSmartValue(row, 'colors'));
        const rawCategory = cleanImportCell(findSmartValue(row, 'category'));

        if (opts.autoExtract) {
          const parsed = parseItemDetails(rawTitle);
          name = parsed.baseName;
          if (!colors || colors === '預設') colors = parsed.color;
          if (!sizes || sizes === 'F') sizes = parsed.size;
        }

        const category = opts.autoCategory
          ? inferCategoryFromTitle(rawTitle, rawCategory)
          : (rawCategory || '未分類');

        tempItems.push({
          sku: cleanImportCell(findSmartValue(row, 'sku')).toUpperCase(),
          name,
          price: parseCleanNumber(findSmartValue(row, 'price')),
          sizeList: splitImportList(sizes),
          colorList: splitImportList(colors),
          category,
          note: opts.importNote ? cleanImportCell(findSmartValue(row, 'note')) : ''
        });
      });

      let merged = tempItems;
      if (opts.groupBySeries) {
        const map = new Map();
        tempItems.forEach(item => {
          if (!map.has(item.name)) {
            map.set(item.name, {
              ...item,
              sizeList: [...item.sizeList],
              colorList: [...item.colorList]
            });
          } else {
            const ex = map.get(item.name);
            item.sizeList.forEach(s => { if (!ex.sizeList.includes(s)) ex.sizeList.push(s); });
            item.colorList.forEach(c => { if (!ex.colorList.includes(c)) ex.colorList.push(c); });
            if (!ex.price && item.price) ex.price = item.price;
            if ((!ex.category || ex.category === '未分類') && item.category) ex.category = item.category;
            if (!ex.note && item.note) ex.note = item.note;
            if (!ex.sku && item.sku) ex.sku = item.sku;
          }
        });
        merged = Array.from(map.values());
      }

      const existingNames = new Set(
        (existingProducts || []).map(p => String(p.name || '').trim().toLowerCase())
      );
      // 沒有款號的商品自動編 SKU-數字，從商品庫現有最大編號往後接，避免撞號
      let skuCounter = (existingProducts || []).reduce((max, p) => {
        const m = /^SKU-(\d+)$/i.exec(p.sku || '');
        return m ? Math.max(max, Number(m[1])) : max;
      }, 0);

      return merged.map(item => {
        const sizeList = opts.smartSort ? sortSizes(item.sizeList) : item.sizeList;
        const isExisting = existingNames.has(item.name.trim().toLowerCase());
        const willImport = !(opts.skipExisting && isExisting);
        const sku = item.sku || (willImport ? `SKU-${++skuCounter}` : '');

        return {
          sku,
          name: item.name,
          price: item.price,
          sizes: sizeList.join(', ') || 'F',
          colors: item.colorList.join(', ') || '預設',
          category: item.category || '未分類',
          note: item.note,
          isExisting,
          willImport
        };
      });
    };

    const sanitizeItem = (item) => ({
      id: item?.id || `item_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`,
      sku: item?.sku || '',
      name: item?.name || '未命名商品',
      color: item?.color || '',
      size: item?.size || 'F',
      price: Number(item?.price) || 0,
      qty: Number(item?.qty) || 1
    });

    const sanitizeOrder = (order) => ({
      id: order?.id || `ORD${Date.now()}`,
      orderNo: order?.orderNo || '', // [V2.1] 選填：Excel 匯入時帶入工作表名稱 (例如 0901林 涔)
      customerName: order?.customerName || '顧客',
      customerPhone: order?.customerPhone || '',
      deliveryMethod: order?.deliveryMethod || '7-11 取貨付款',
      storeName: order?.storeName || '',
      shippingFee: Number(order?.shippingFee) ?? 60,
      paymentStatus: Boolean(order?.paymentStatus),
      shipmentStatus: order?.shipmentStatus || 'unshipped',
      items: Array.isArray(order?.items) ? order.items.map(sanitizeItem) : [],
      note: order?.note || '',
      createdAt: order?.createdAt || new Date().toLocaleString('zh-TW', { hour12: false }),
      timestamp: order?.timestamp || Date.now()
    });

    const sanitizeProduct = (prod) => ({
      id: prod?.id || `prod_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`,
      sku: prod?.sku || '',
      name: prod?.name || '新品',
      price: Number(prod?.price) || 0,
      sizes: prod?.sizes || 'S, M, L, XL',
      colors: prod?.colors || '黑色, 白色',
      category: prod?.category || inferCategoryFromTitle(prod?.name || '', ''),
      note: prod?.note || '',
      createdAt: prod?.createdAt || new Date().toISOString(),
      lastOrderedAt: prod?.lastOrderedAt || null,
      status: prod?.status || 'active',
      pinned: Boolean(prod?.pinned) // [V2.4] 釘選為常用商品
    });

    const DEFAULT_PRODUCTS = [
      {
        sku: 'A01',
        name: '韓系重磅純棉T恤',
        price: 390,
        sizes: 'S, M, L, XL',
        colors: '奶茶色, 燕麥白, 純黑色',
        category: '服飾',
        note: '熱銷爆款，版型偏大舒適',
        createdAt: '2025-01-10T08:00:00.000Z',
        status: 'active'
      },
      {
        sku: 'B02',
        name: '高腰顯瘦直筒牛仔褲',
        price: 590,
        sizes: 'S, M, L',
        colors: '淺藍, 深藍',
        category: '服飾',
        note: '彈性極佳，高腰收腹設計',
        createdAt: '2024-08-15T08:00:00.000Z',
        status: 'active'
      },
      {
        sku: 'C03',
        name: '法式碎花長洋裝',
        price: 780,
        sizes: 'F',
        colors: '杏色, 霧藍',
        category: '服飾',
        note: '附同色系腰帶，長度115cm',
        createdAt: '2024-01-05T08:00:00.000Z',
        status: 'active'
      },
      {
        sku: 'D04',
        name: '復古寬鬆落肩外套',
        price: 980,
        sizes: 'M, L',
        colors: '軍綠, 水洗黑',
        category: '服飾',
        note: '秋冬新品，挺版防風布料',
        createdAt: new Date(Date.now() - 45 * 86400000).toISOString(),
        status: 'active'
      },
      {
        sku: 'E05',
        name: '極簡皮革小方包',
        price: 450,
        sizes: 'F',
        colors: '焦糖, 墨黑, 象牙白',
        category: '鞋包配飾',
        note: '頭層牛皮質感，附長短背帶',
        createdAt: '2024-03-20T08:00:00.000Z',
        status: 'active'
      }
    ];

    // ==========================================
    // [V2.1] 訂單列表升級：金額計算工具
    // 折抵 / 內退 項目以「單價為負數」表示，不需要額外欄位。
    // ==========================================
    // 「Excel 總計差額調整」這種自動產生的調整行用固定款號標記，
    // 這樣即使差額是正數，也不會被當成實體商品算進理貨清單。
    const ADJUSTMENT_SKU = 'ADJ';
    const isAdjustmentItem = (item) => Number(item?.price) < 0 || item?.sku === ADJUSTMENT_SKU;

    const calcOrderSubtotal = (order) =>
      (order?.items || []).reduce((sum, i) => sum + (Number(i.price) || 0) * (Number(i.qty) || 0), 0);

    // 統一四捨五入成整數，避免小數單價造成 99.99999 之類的顯示
    const calcOrderTotal = (order) =>
      Math.round(calcOrderSubtotal(order) + (Number(order?.shippingFee) || 0));

    // [V2.6.2] 訂單卡片上的簡短日期：今年的訂單只顯示「9/16」，其他年份顯示完整日期
    const formatOrderDateShort = (createdAt) => {
      const datePart = String(createdAt || '').split(' ')[0];
      const parts = datePart.split('/');
      if (parts.length === 3 && Number(parts[0]) === new Date().getFullYear()) return `${parts[1]}/${parts[2]}`;
      return datePart;
    };

    // [V2.6] 訂單日期篩選：把時間戳轉成「本地日期」YYYY-MM-DD
    const toDateKey = (ts) => {
      const d = new Date(ts);
      if (isNaN(d.getTime())) return '';
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    const formatDateChipLabel = (key, nowMs = Date.now()) => {
      if (key === toDateKey(nowMs)) return '今天';
      if (key === toDateKey(nowMs - 86400000)) return '昨天';
      const [, m, d] = key.split('-');
      return `${Number(m)}/${Number(d)}`;
    };

    // ==========================================
    // [V2.4] 新增訂單「快速帶入」：近期熱銷自動排序
    // 不去猜「檔期」，改用時間衰減：越近的訂單權重越高（每過 N 天減半），
    // 所以這一檔的明星商品會自動浮上來、上一檔的舊明星商品自然沉下去。
    // ==========================================
    const QUICK_PICK_HALF_LIFE_DAYS = 7;   // 權重減半所需天數
    const QUICK_PICK_RECENT_DAYS = 14;     // 畫面上顯示「近 N 天賣出幾件」
    const QUICK_PICK_SLOTS = 8;            // 常用區最多幾個（釘選 + 熱銷）
    const QUICK_PICK_MIN_SCORE = 0.25;     // 約等於「兩週內賣過 1 件」，低於此不算熱銷
    const QUICK_PICK_NEW_DAYS = 30;        // 建檔 30 天內算新品

    // 尺寸 / 顏色欄位的拆分（逗號、頓號、斜線、空白）
    const splitProductOptions = (s) =>
      String(s || '').split(/[,，、/ ]+/).map(x => x.trim()).filter(Boolean);

    // 只有一種尺寸且一種顏色 → 可以「＋」一鍵直接加入，不必再選規格
    const isSingleVariantProduct = (p) =>
      splitProductOptions(p.sizes).length <= 1 && splitProductOptions(p.colors).length <= 1;

    // 依訂單歷史算出每個商品的熱銷分數。比對方式與滯銷分析一致：先款號、再品名。
    const computeProductScores = (products, orders, nowMs = Date.now()) => {
      const bySku = new Map();
      const byName = new Map();
      products.forEach(p => {
        const s = String(p.sku || '').trim().toUpperCase();
        if (s && !bySku.has(s)) bySku.set(s, p.id);
        const n = String(p.name || '').trim().toLowerCase();
        if (n && !byName.has(n)) byName.set(n, p.id);
      });

      const scores = {};
      const recent = {};
      orders.forEach(order => {
        const ts = Number(order.timestamp) || 0;
        if (!ts) return;
        const ageDays = Math.max(0, (nowMs - ts) / 86400000);
        const weight = Math.pow(0.5, ageDays / QUICK_PICK_HALF_LIFE_DAYS);

        (order.items || []).forEach(item => {
          if (isAdjustmentItem(item)) return;
          const skuKey = String(item.sku || '').trim().toUpperCase();
          const nameKey = String(item.name || '').trim().toLowerCase();
          const id = (skuKey && bySku.get(skuKey)) || byName.get(nameKey);
          if (!id) return;
          const qty = Math.max(0, Number(item.qty) || 0);
          scores[id] = (scores[id] || 0) + qty * weight;
          if (ageDays <= QUICK_PICK_RECENT_DAYS) recent[id] = (recent[id] || 0) + qty;
        });
      });
      return { scores, recent };
    };

    // 排序：釘選 → 熱銷分數 → 建檔時間(新的在前) → 名稱
    const compareByQuickRank = (scores) => (a, b) => {
      if (Boolean(a.pinned) !== Boolean(b.pinned)) return a.pinned ? -1 : 1;
      const sa = scores[a.id] || 0;
      const sb = scores[b.id] || 0;
      if (Math.abs(sa - sb) > 1e-9) return sb - sa;
      const ta = new Date(a.createdAt).getTime() || 0;
      const tb = new Date(b.createdAt).getTime() || 0;
      if (ta !== tb) return tb - ta;
      return String(a.name).localeCompare(String(b.name), 'zh-Hant');
    };

    // [V2.4.1] 手機版只顯示 3～4 個：品名短最多 4 個；品名長（會折成兩行）約 3 個。
    // 依排序順序累加，遇到放不下的就停止，確保顯示的一定是排名最前面的。
    const MOBILE_QUICK_MAX_ITEMS = 4;
    const MOBILE_QUICK_MAX_LINES = 6;
    const MOBILE_CHARS_PER_LINE = 15; // 手機一行大約能放的字數（含徽章）
    const estimateNameLines = (name) => Math.max(1, Math.ceil((String(name || '').length + 2) / MOBILE_CHARS_PER_LINE));

    const pickMobileVisibleIds = (orderedProducts) => {
      const ids = new Set();
      let lines = 0;
      for (const p of orderedProducts) {
        const need = Math.min(2, estimateNameLines(p.name)); // 名稱最多顯示兩行
        if (ids.size >= MOBILE_QUICK_MAX_ITEMS || lines + need > MOBILE_QUICK_MAX_LINES) break;
        ids.add(p.id);
        lines += need;
      }
      return ids;
    };

    // 產生畫面要用的三份清單：常用區(釘選+熱銷)、新品區、完整排序清單(已排除下架歸檔)
    const buildQuickPickLists = (products, scores, nowMs = Date.now()) => {
      const active = products.filter(p => p.status !== 'archived');
      const allSorted = [...active].sort(compareByQuickRank(scores));

      const pinned = allSorted.filter(p => p.pinned).slice(0, QUICK_PICK_SLOTS);
      const hot = allSorted
        .filter(p => !p.pinned && (scores[p.id] || 0) >= QUICK_PICK_MIN_SCORE)
        .slice(0, Math.max(0, QUICK_PICK_SLOTS - pinned.length));
      const quick = [...pinned, ...hot];

      const quickIds = new Set(quick.map(p => p.id));
      const createdTime = (p) => new Date(p.createdAt).getTime() || 0;
      const byNewest = active.filter(p => !quickIds.has(p.id)).sort((a, b) => createdTime(b) - createdTime(a));
      const recentNew = byNewest.filter(p => nowMs - createdTime(p) <= QUICK_PICK_NEW_DAYS * 86400000).slice(0, 3);
      // 還沒有任何訂單紀錄時（剛開始使用），改顯示最新建檔的商品
      const fresh = quick.length === 0 ? byNewest.slice(0, 6) : recentNew;

      return { quick, fresh, allSorted };
    };

    // ==========================================
    // [V2.1] 訂單 Excel 匯入：智慧解析
    // 解析邏輯沿用「訂單列表程式碼」：每個工作表 = 一筆訂購單，
    // 只是輸出改成主程式 (Firebase) 的欄位格式。
    // ==========================================
    const parseCleanNumber = (val) => {
      if (typeof val === 'number') return isNaN(val) ? 0 : val;
      if (!val) return 0;
      const cleaned = String(val).replace(/[,NT\$\s元]/g, '').trim();
      const num = parseFloat(cleaned);
      return isNaN(num) ? 0 : num;
    };

    // 訂購單範本的空欄位是「______________」，不能當成真的資料
    const cleanExcelPlaceholder = (val) => {
      const s = String(val || '').trim();
      return /^[_＿\-－\s]*$/.test(s) ? '' : s;
    };

    // 這些名稱的工作表視為範本/備份頁，匯入時略過
    const ORDER_IMPORT_SKIP_SHEETS = ['原稿', '工作表37', 'Template', 'Sheet1'];

    // Excel 內的簡稱 → 主程式的配送方式選項
    const mapImportedDelivery = (method) => {
      if (method === '全家') return '全家取貨付款';
      if (method === '宅配') return '宅配到府';
      return '7-11 取貨付款';
    };

    // [V2.4] 工作表名稱前四碼 = 建單日期（MMDD，例如「0901林 涔」→ 9/1）。
    // 年份沒寫：先假設今年；若算出來比今天晚超過 2 天，就當成去年。時間統一設成中午 12 點。
    const inferOrderTimestampFromSheetName = (sheetName, nowMs = Date.now()) => {
      const m = /^(\d{2})(\d{2})/.exec(String(sheetName || '').trim());
      if (!m) return null;
      const month = Number(m[1]);
      const day = Number(m[2]);
      if (month < 1 || month > 12 || day < 1 || day > 31) return null;

      const year = new Date(nowMs).getFullYear();
      let d = new Date(year, month - 1, day, 12, 0, 0);
      if (d.getMonth() !== month - 1) return null; // 例如 0231 這種不存在的日期
      if (d.getTime() > nowMs + 2 * 86400000) d = new Date(year - 1, month - 1, day, 12, 0, 0);
      return d.getTime();
    };

    const parseOrderExcelWorkbook = (workbook) => {
      const drafts = [];

      workbook.SheetNames.forEach(sheetName => {
        const cleanedSheetName = sheetName.trim();
        if (ORDER_IMPORT_SKIP_SHEETS.includes(cleanedSheetName)) return;

        const worksheet = workbook.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });

        if (!rows || rows.length < 3) return;

        let customerName = '';
        let customerPhone = '';
        let shippingMethod = '7-11';
        let storeAddress = '';
        let shippingFee = 38;
        let excelTotalAmount = null;

        // 1. 解析買家基本資訊 (買家姓名、電話、門市)
        for (let r = 0; r < Math.min(8, rows.length); r++) {
          const row = rows[r] || [];
          for (let c = 0; c < row.length; c++) {
            const cell = String(row[c] || '').trim();
            if (cell.includes('顧客姓名') || cell.includes('收件人')) {
              const nameMatch = cell.match(/(?:顧客姓名|收件人)\s*[:：]\s*(.*)/);
              if (nameMatch && nameMatch[1]) customerName = nameMatch[1].trim();
              else if (row[c + 1]) customerName = String(row[c + 1]).trim();
            }
            if (cell.includes('手機') || cell.includes('電話')) {
              const phoneMatch = cell.match(/(?:手機|電話)\s*[:：]\s*(.*)/);
              if (phoneMatch && phoneMatch[1]) customerPhone = phoneMatch[1].trim();
              else if (row[c + 1]) customerPhone = String(row[c + 1]).trim();
            }
            if (cell.includes('到貨店家') || cell.includes('取件門市') || cell.includes('取貨門市') || cell.includes('7-11門市') || cell.includes('門市') || cell.includes('賣貨便')) {
              const storeMatch = cell.match(/(?:到貨店家|取件門市|取貨門市|7-11門市|門市|賣貨便)\s*[:：]\s*(.*)/);
              if (storeMatch && storeMatch[1]) storeAddress = storeMatch[1].trim();
              else if (row[c + 1]) storeAddress = String(row[c + 1]).trim();
            }
            if (cell.includes('全家')) shippingMethod = '全家';
            if (cell.includes('宅配')) shippingMethod = '宅配';
            if (cell.includes('7-11') || cell.includes('賣貨便')) shippingMethod = '7-11';
          }
        }

        customerName = cleanExcelPlaceholder(customerName);
        customerPhone = cleanExcelPlaceholder(customerPhone);
        storeAddress = cleanExcelPlaceholder(storeAddress);
        if (!customerName) customerName = cleanedSheetName;

        // 2. 尋找商品表頭列 (品項, 金額, 數量)
        let headerRowIdx = -1;
        for (let r = 0; r < rows.length; r++) {
          const rowStr = rows[r].map(c => String(c)).join(' ');
          if (rowStr.includes('品項') && (rowStr.includes('金額') || rowStr.includes('數量'))) {
            headerRowIdx = r;
            break;
          }
        }

        const items = [];
        if (headerRowIdx !== -1) {
          const header = rows[headerRowIdx].map(c => String(c).trim());
          const colItem = header.findIndex(h => h.includes('品項'));
          const colPrice = header.findIndex(h => h === '金額' || h.includes('單價'));
          const colQty = header.findIndex(h => h.includes('數量'));
          const colRowTotal = header.findIndex(h => h.includes('總金額'));

          for (let r = headerRowIdx + 1; r < rows.length; r++) {
            const row = rows[r];
            if (!row) continue;

            const itemName = String(row[colItem] || '').trim();
            if (!itemName) continue;

            // 遇到底部統計列時停止抓取商品
            if (itemName.includes('金額') || itemName.includes('運費') || itemName.includes('總計') || itemName.includes('備註')) break;

            const price = parseCleanNumber(row[colPrice]);
            const qty = parseInt(parseCleanNumber(row[colQty]), 10) || 0;
            const rowTotal = parseCleanNumber(row[colRowTotal]);

            // 檢測是否為折抵/內退項目 (例如: 內退62元)
            const isAdjustment = /內退|退款|折扣|折抵|優惠|補貼/.test(itemName);

            if (isAdjustment) {
              let discountAmt = 0;
              const matchNum = itemName.match(/(?:內退|退款|折扣|折抵)\s*(\d+)/);
              if (matchNum && matchNum[1]) {
                discountAmt = parseFloat(matchNum[1]);
              } else if (price !== 0) {
                discountAmt = Math.abs(price);
              } else if (rowTotal !== 0) {
                discountAmt = Math.abs(rowTotal);
              }

              if (discountAmt > 0) {
                items.push({
                  sku: '',
                  name: itemName,
                  color: '折抵',
                  size: 'F',
                  qty: 1,
                  price: -Math.abs(discountAmt)
                });
              }
            } else if (qty > 0 || price > 0) {
              // [V2.1.1] 與「商品庫智慧匯入」共用同一套拆解規則：
              // 「消防小狗長袖上衣-藏青色90」→ 品名 / 顏色 藏青色 / 尺寸 90，
              // 這樣訂單、理貨清單、商品庫、滯銷分析才對得起來。
              const parsed = parseItemDetails(itemName);
              items.push({
                sku: '',
                name: parsed.baseName,
                color: parsed.color,
                size: parsed.size,
                qty: qty || 1,
                price: price
              });
            }
          }
        }

        // 3. 解析運費與 Excel 底層記載的總金額
        for (let r = 0; r < rows.length; r++) {
          const row = rows[r] || [];
          for (let c = 0; c < row.length; c++) {
            const cellVal = String(row[c] || '').trim();
            if (cellVal.includes('運費')) {
              const val = parseCleanNumber(row[c + 1]);
              if (val >= 0) shippingFee = val;
            } else if (cellVal.includes('總計')) {
              const val = parseCleanNumber(row[c + 1]);
              if (val > 0) excelTotalAmount = val;
            }
          }
        }

        if (items.length > 0 || customerName) {
          const draftItems = items.map(sanitizeItem);
          const draftShipping = Math.round(shippingFee);
          const excelTotal = excelTotalAmount ? Math.round(excelTotalAmount) : null;

          // Excel 的「金額」欄常有隱藏的折扣公式（例如 95 折、小數），
          // 明細加總會跟 Excel 總計對不上。以 Excel 總計為準（那才是客人實際要付的），
          // 差額用一行明確的「調整」補上，預覽和列表都看得到，也能事後編輯。
          const itemsSum = draftItems.reduce((s, i) => s + i.price * i.qty, 0);
          const computed = Math.round(itemsSum + draftShipping);
          if (excelTotal !== null && Math.abs(excelTotal - computed) >= 1) {
            draftItems.push(sanitizeItem({
              sku: ADJUSTMENT_SKU,
              name: 'Excel 總計差額調整（折扣／小數）',
              color: '調整',
              size: 'F',
              qty: 1,
              price: excelTotal - computed
            }));
          }

          drafts.push({
            orderNo: cleanedSheetName,
            customerName,
            customerPhone,
            deliveryMethod: mapImportedDelivery(shippingMethod),
            storeName: storeAddress,
            shippingFee: draftShipping,
            paymentStatus: false,
            shipmentStatus: 'unshipped',
            items: draftItems,
            note: '由 Excel 檔案匯入',
            // 以下兩個欄位僅供預覽與計算用，寫入資料庫前會移除
            excelTotal,
            orderTimestamp: inferOrderTimestampFromSheetName(cleanedSheetName)
          });
        }
      });

      return drafts;
    };

    // 訂單 Excel 匯入預覽 Modal（可勾選、標示重複單號 / 已對齊 Excel 總計）
    function OrderImportPreviewModal({ drafts, existingOrderNos, isSaving, onClose, onConfirm }) {
      const rows = React.useMemo(() => drafts.map((d, idx) => {
        const computed = calcOrderTotal(d);
        return {
          idx,
          d,
          computed,
          isDuplicate: Boolean(d.orderNo) && existingOrderNos.has(d.orderNo),
          isEmpty: d.items.length === 0,
          adjustLine: d.items.find(i => i.sku === ADJUSTMENT_SKU) || null
        };
      }), [drafts, existingOrderNos]);

      const [selected, setSelected] = React.useState(
        () => new Set(rows.filter(r => !r.isDuplicate && !r.isEmpty).map(r => r.idx))
      );

      const toggleOne = (idx) => {
        setSelected(prev => {
          const next = new Set(prev);
          if (next.has(idx)) next.delete(idx);
          else next.add(idx);
          return next;
        });
      };

      const importableIdx = rows.filter(r => !r.isEmpty).map(r => r.idx);
      const allChecked = importableIdx.length > 0 && importableIdx.every(i => selected.has(i));
      const toggleAll = () => {
        setSelected(allChecked ? new Set() : new Set(importableIdx));
      };

      const duplicateCount = rows.filter(r => r.isDuplicate).length;
      const adjustedCount = rows.filter(r => r.adjustLine).length;
      const selectedTotal = rows.filter(r => selected.has(r.idx)).reduce((s, r) => s + r.computed, 0);

    // 真正的資料保護在 Firebase 規則（依 UID 白名單），登入畫面只是入口。
    // ==========================================
    const mapAuthError = (err) => {
      const code = err?.code || '';
      if (['auth/invalid-credential', 'auth/wrong-password', 'auth/user-not-found', 'auth/invalid-login-credentials'].includes(code)) {
        return '帳號或密碼錯誤';
      }
      if (code === 'auth/invalid-email') return '信箱格式不正確';
      if (code === 'auth/too-many-requests') return '嘗試次數過多，請稍後再試';
      if (code === 'auth/network-request-failed') return '網路連線失敗，請檢查網路';
      if (code === 'auth/user-disabled') return '這個帳號已被停用';
      if (code === 'auth/operation-not-supported-in-this-environment') return '目前的開啟方式不支援登入，請改用網頁網址開啟';
      return `登入失敗（${code || '未知錯誤'}）`;
    };

    // 登入狀態閘門：沒登入 → 登入畫面；登入後才載入主程式（也才開始讀資料庫）
    function AuthGate() {
      const [user, setUser] = React.useState(undefined); // undefined = 還在確認登入狀態

      React.useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((u) => {
          // 匿名登入不視為有效登入（以前若曾啟用匿名，這裡會直接登出）
          if (u && u.isAnonymous) {
            auth.signOut();
            return;
          }
          setUser(u);
        });
        return unsubscribe;
      }, []);

      if (user === undefined) {
        return (
          <div className="min-h-screen flex items-center justify-center text-sm text-slate-400">
            確認登入狀態中...
          </div>
        );
      }
      if (!user) return <LoginScreen />;
      return <SproutOrderAssistant user={user} onSignOut={() => auth.signOut()} />;
    }

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 2500);
      };

      // ------------------------------------------
      // Real-time Firebase Database Listeners (on)
      // ------------------------------------------
      React.useEffect(() => {
        setIsSyncing(true);

        // 1. Monitor Connection Status
        const connectedRef = db.ref('.info/connected');
        connectedRef.on('value', (snap) => {
          setIsConnected(snap.val() === true);
          setIsSyncing(false);
        });

        // 2. Listen to Orders Ref
        const ordersRef = dbRef('orders');
        ordersRef.on('value', (snapshot) => {
          const val = snapshot.val();
          if (!val) {
            setOrders([]);
          } else {
            const loadedOrders = Object.entries(val).map(([id, data]) => 
              sanitizeOrder({ id, ...data })
            );
            loadedOrders.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            setOrders(loadedOrders);
          }
          setIsSyncing(false);
        }, (error) => {
          console.error("RTDB Orders Error:", error);
          setIsSyncing(false);
          if (error && error.code === 'PERMISSION_DENIED') {
            setPermissionDenied(true);
          } else {
            showToast('⚠️ 雲端訂單同步異常，請檢查網路連線');
          }
        });

        // 3. Listen to Products Ref
        const productsRef = dbRef('products');
        productsRef.on('value', (snapshot) => {
          const val = snapshot.val();
          if (!val) {
            setProducts([]);
            // [V2.3] 只在「從來沒初始化過」時補範例商品（用 transaction 保證只有一台裝置會執行）。
            // 使用者自己把商品全刪光之後，不會再自動補回範例商品。
            dbRef('settings/productsSeeded').transaction(
              (current) => (current ? undefined : true),
              (error, committed) => {
                if (error || !committed) return;
                DEFAULT_PRODUCTS.forEach(p => {
                  dbRef('products').push(sanitizeProduct(p));
                });
              }
            );
          } else {
            const loadedProducts = Object.entries(val).map(([id, data]) => 
              sanitizeProduct({ id, ...data })
            );
            setProducts(loadedProducts);
            // 商品庫有資料 → 標記「已初始化」（每次開啟只寫一次）
            if (!productsFlagSynced.current) {
              productsFlagSynced.current = true;
              dbRef('settings/productsSeeded').set(true);
            }
          }
        }, (error) => {
          console.error("RTDB Products Error:", error);
        });

        // 4. Listen to Tally States
        const tallyRef = dbRef('settings/tally');
        tallyRef.on('value', (snapshot) => {
          setTallyChecked(snapshot.val() || {});
        });

        return () => {
          ordersRef.off();
          productsRef.off();
          tallyRef.off();
          connectedRef.off();

      React.useEffect(() => {

            const skuKey = item.sku ? item.sku.trim().toUpperCase() : null;

            if (skuKey) {
              if (!latestOrderMap[skuKey] || orderTime > latestOrderMap[skuKey]) {
                latestOrderMap[skuKey] = orderTime;
              }
            }
            if (nameKey) {
              if (!latestOrderMap[nameKey] || orderTime > latestOrderMap[nameKey]) {
                latestOrderMap[nameKey] = orderTime;
              }
            }
          });

        return products.map(p => {
          const skuKey = p.sku ? p.sku.trim().toUpperCase() : null;
          const nameKey = p.name ? p.name.trim().toLowerCase() : null;

          let computedLastOrderTime = null;
          if (skuKey && latestOrderMap[skuKey]) {
            computedLastOrderTime = latestOrderMap[skuKey];
          } else if (nameKey && latestOrderMap[nameKey]) {
            computedLastOrderTime = latestOrderMap[nameKey];
          }

          let finalLastOrderedAt = p.lastOrderedAt;
          if (computedLastOrderTime) {
            finalLastOrderedAt = new Date(computedLastOrderTime).toISOString();
          }

          return {
            ...p,
            lastOrderedAt: finalLastOrderedAt
          };
        });
      }, [products, orders]);

      // Form state for new orders

      const [selectedProductRef, setSelectedProductRef] = React.useState(null);

      const [filterDelivery, setFilterDelivery] = React.useState('all'); // [V2.1] 'all' | '7-11' | '全家' | '宅配'
      const [expandedOrders, setExpandedOrders] = React.useState({});

      // Smart Text Parser for Orders
      const handleParseLineText = () => {
        if (!lineText.trim()) {
          showToast('請先貼上顧客的對話訊息！');
          return;
        }

        let name = '';

        let store = '';
        let delivery = deliveryMethod;

        const phoneMatch = lineText.match(/(?:電話|手機|tel|phone)?[:\s]*(\+?\d{8,15}|09\d{8}|\d{3}[-\s]?\d{3}[-\s]?\d{4})/i) || lineText.match(/(09\d{2}[-\s]?\d{3}[-\s]?\d{3})/);
        if (phoneMatch) {
          phone = phoneMatch[1].replace(/[-\s]/g, '');
        }

        if (/全家|familymart/i.test(lineText)) {
          delivery = '全家取貨付款';
          const storeMatch = lineText.match(/(?:全家|門市|店名)[:\s]*([^\n,，]+)/i);
          if (storeMatch) store = storeMatch[1].trim();
        } else if (/宅配|郵寄|地址/i.test(lineText)) {
          delivery = '宅配到府';
          const addrMatch = lineText.match(/(?:地址|宅配)[:\s]*([^\n]+)/i);
          if (addrMatch) store = addrMatch[1].trim();
        } else {
          delivery = '7-11 取貨付款';
          const storeMatch = lineText.match(/(?:7-11|711|7-eleven|門市|店名)[:\s]*([^\n,，]+)/i);
          if (storeMatch) store = storeMatch[1].trim();
        }

        const nameMatch = lineText.match(/(?:姓名|名字|收件人|稱呼)[:\s]*([^\n,，]+)/i);
        if (nameMatch) {
          name = nameMatch[1].trim();
        } else {
          const lines = lineText.split('\n').map(l => l.trim()).filter(Boolean);
          if (lines.length > 0 && !lines[0].match(/\d{8,}/) && lines[0].length <= 20) {
            name = lines[0].replace(/^(姓名|名字|收件人)[:\s]*/i, '');

          const skuByName = new Map();

              items: linkedItems,

        } catch (err) {
          console.error("Save product error:", err);
          showToast('❌ 儲存商品失敗');
        }
      };

      const handleDuplicateProduct = async (prod) => {
        try {
          const dupData = {
            sku: prod.sku ? `${prod.sku}_copy` : '',
            name: `${prod.name} (副本)`,
            price: prod.price,
            sizes: prod.sizes,
            colors: prod.colors,
            category: prod.category,
            note: prod.note,
            status: 'active',
            createdAt: new Date().toISOString()
          };
          await dbRef('products').push(dupData);
          showToast(`已成功複製商品：「${prod.name}」`);
        } catch (err) {
          console.error("Duplicate product error:", err);
        }
      };

      const handleToggleArchiveProduct = async (prod) => {
        const nextStatus = prod.status === 'archived' ? 'active' : 'archived';
        try {
          await dbRef(`products/${prod.id}`).update({ status: nextStatus });
          showToast(nextStatus === 'archived' ? '商品已下架歸檔' : '商品已重新上架');
        } catch (err) {
          console.error("Archive product error:", err);
        }
      };

      const handleDeleteProduct = async (prodId) => {
        if (!window.confirm('確定要永久刪除此商品嗎？')) return;
        try {
          await dbRef(`products/${prodId}`).remove();
          showToast('商品已從雲端刪除');
        } catch (err) {
          console.error("Delete product error:", err);
        }
      };

      // Excel / CSV File Import Handler（[V2.1.1] 智慧歸納版）
      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setImportFileName(file.name);
        const reader = new FileReader();

        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheetName = workbook.SheetNames[0];
            const sheet = workbook.Sheets[sheetName];
            const rawData = XLSX.utils.sheet_to_json(sheet, { defval: '' });

            if (!rawData || rawData.length === 0) {
              showToast('❌ 檔案內容空白或無有效資料');
              return;
            }

            // 先進預覽視窗，由視窗告訴使用者「認得哪些欄位、能匯入幾項」，
            // 就算欄位名稱認不得也不會只跳一句錯誤就結束。
            setImportRawRows(rawData);
            setIsImportModalOpen(true);
          } catch (err) {
            console.error('Import error:', err);
            showToast('❌ 讀取 Excel 檔案失敗');
          }
        };

        reader.onerror = () => showToast('❌ 讀取檔案失敗');
        reader.readAsArrayBuffer(file);
        e.target.value = '';
      };

      const handleCloseImportModal = () => {
        if (isProductImporting) return;
        setIsImportModalOpen(false);
        setImportRawRows([]);
      };

      const handleConfirmBatchImport = async () => {
        const toImport = parsedImportProducts.filter(p => p.willImport);
        if (toImport.length === 0) {
          showToast('沒有可匯入的新商品');
          return;
        }

        setIsProductImporting(true);
        try {
          const createdAt = new Date().toISOString();
          const updates = {};
          toImport.forEach(({ isExisting, willImport, ...prodData }) => {
            const newKey = dbRef('products').push().key;
            updates[newKey] = { ...prodData, createdAt, status: 'active' };
          });

          // 一次性寫入，要嘛全成功、要嘛全失敗
          await dbRef('products').update(updates);
          showToast(`🎉 成功匯入 ${toImport.length} 項商品！`);
          setIsImportModalOpen(false);
          setImportRawRows([]);
        } catch (err) {
          console.error("Batch import error:", err);
          showToast('❌ 匯入過程發生錯誤，請檢查權限或網路連線');
        } finally {
          setIsProductImporting(false);
        }
      };

      const handleExportProductsExcel = () => {
        if (enrichedProducts.length === 0) {
          showToast('目前沒有商品可供匯出');
          return;
        }

        const exportData = enrichedProducts.map(p => {
          const stagnant = getStagnantInfo(p);
          return {
            '商品款號': p.sku || '',
            '商品名稱': p.name || '',
            '分類': p.category || '未分類',
            '預設售價': p.price || 0,
            '尺寸選項': p.sizes || '',
            '顏色款式': p.colors || '',
            '銷售與滯銷狀態': stagnant.label,
            '建檔日期': formatDate(p.createdAt),
            '最近下單日期': formatDate(p.lastOrderedAt),
            '備註說明': p.note || ''
          };
        });

        const ws = XLSX.utils.json_to_sheet(exportData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, '商品庫與滯銷分析');
        XLSX.writeFile(wb, `小豆苗商品庫報表_${new Date().toISOString().slice(0,10)}.xlsx`);
        showToast('📊 已成功匯出商品庫 Excel 報表！');
      };

      // Filtered Product Library
      const filteredProducts = React.useMemo(() => {
        return enrichedProducts.filter(p => {
          const matchSearch = 
            p.name.toLowerCase().includes(productSearch.toLowerCase()) ||
            p.sku.toLowerCase().includes(productSearch.toLowerCase()) ||
            p.note.toLowerCase().includes(productSearch.toLowerCase()) ||
            p.colors.toLowerCase().includes(productSearch.toLowerCase());

          const matchCategory = 
            productCategoryFilter === 'all' ? true :
            productCategoryFilter === '未分類' ? (!p.category || p.category === '未分類') :
            p.category === productCategoryFilter;

          const stagnant = getStagnantInfo(p);
          const matchStagnant = 
            productStagnantFilter === 'all' ? true :
            productStagnantFilter === 'active' ? stagnant.type === 'active' :
            productStagnantFilter === 'warning' ? stagnant.type === 'warning' :
            productStagnantFilter === 'critical' ? stagnant.type === 'critical' :
            productStagnantFilter === 'archived' ? p.status === 'archived' : true;

          return matchSearch && matchCategory && matchStagnant;
        });
      }, [enrichedProducts, productSearch, productCategoryFilter, productStagnantFilter]);

      const selectedProductVisibleCount = React.useMemo(() => {
        return filteredProducts.filter(p => selectedProductIds.has(p.id)).length;
      }, [filteredProducts, selectedProductIds]);

      const categoriesList = React.useMemo(() => {
        const set = new Set(['服飾', '鞋包配飾', '母嬰用品', '未分類']);
        enrichedProducts.forEach(p => {
          if (p.category) set.add(p.category);
        });
        return Array.from(set);
      }, [enrichedProducts]);

      // [V2.1.1] 商品匯入預覽：原始列 + 勾選選項 → 商品清單
      const parsedImportProducts = React.useMemo(() => {
        if (importRawRows.length === 0) return [];
        return buildImportProducts(importRawRows, importOptions, products);
      }, [importRawRows, importOptions, products]);

      const importHeaders = React.useMemo(() => {
        return importRawRows.length > 0 ? Object.keys(importRawRows[0]) : [];
      }, [importRawRows]);

      // Filtered Orders for Tab 2
      const filteredOrders = React.useMemo(() => {
        const q = searchTerm.trim().toLowerCase();
        return orders.filter(o => {
          const matchSearch = !q || (
            o.customerName.toLowerCase().includes(q) ||
            o.customerPhone.includes(searchTerm.trim()) ||
            o.storeName.toLowerCase().includes(q) ||
            o.orderNo.toLowerCase().includes(q) ||
            o.note.toLowerCase().includes(q) ||
            o.items.some(i => i.name.toLowerCase().includes(q) || i.sku.toLowerCase().includes(q))
          );

          const matchPayment = 
            filterPayment === 'all' ? true :
            filterPayment === 'paid' ? o.paymentStatus : !o.paymentStatus;

          const matchShipment = 
            filterShipment === 'all' ? true :
            filterShipment === 'shipped' ? o.shipmentStatus === 'shipped' : o.shipmentStatus === 'unshipped';

          const matchDelivery =
            filterDelivery === 'all' ? true : (o.deliveryMethod || '').includes(filterDelivery);

          const matchDate =
            filterDate === 'all' ? true : toDateKey(o.timestamp) === filterDate;

          return matchSearch && matchPayment && matchShipment && matchDelivery && matchDate;
        });
      }, [orders, searchTerm, filterPayment, filterShipment, filterDelivery, filterDate]);

      // [V2.1] 訂單列表上方的統計卡片（以全部訂單計算，不受篩選影響）
      const orderListStats = React.useMemo(() => {
        let unpaidCount = 0;
        let unshippedCount = 0;
        let readyToShipCount = 0;
        let receivedRevenue = 0;
        let pendingRevenue = 0;

        orders.forEach(o => {
          const total = calcOrderTotal(o);
          if (o.paymentStatus) {
            receivedRevenue += total;
          } else {
            unpaidCount += 1;
            pendingRevenue += total;
          }
          if (o.shipmentStatus !== 'shipped') {
            unshippedCount += 1;
            if (o.paymentStatus) readyToShipCount += 1; // 已付款、等著出貨
          }
        });

        return {
          total: orders.length,
          paidCount: orders.length - unpaidCount,
          unpaidCount,
          unshippedCount,
          readyToShipCount,
          receivedRevenue,
          pendingRevenue
        };
      }, [orders]);

      const filteredOrdersTotal = React.useMemo(() => {
        return filteredOrders.reduce((sum, o) => sum + calcOrderTotal(o), 0);
      }, [filteredOrders]);

      const selectedVisibleCount = React.useMemo(() => {
        return filteredOrders.filter(o => selectedOrderIds.has(o.id)).length;
      }, [filteredOrders, selectedOrderIds]);

      const selectedVisibleTotal = React.useMemo(() => {
        return filteredOrders.filter(o => selectedOrderIds.has(o.id)).reduce((s, o) => s + calcOrderTotal(o), 0);
      }, [filteredOrders, selectedOrderIds]);

      const hasActiveOrderFilter =
        searchTerm.trim() !== '' || filterPayment !== 'all' || filterShipment !== 'all' || filterDelivery !== 'all' || filterDate !== 'all';

      // [V2.6] 日期快捷鈕：有訂單的日期（最近 14 天有單的日子），選到較舊日期時也會顯示在最前面
      const orderDateChips = React.useMemo(() => {
        const counts = new Map();
        orders.forEach(o => {
          const key = toDateKey(o.timestamp);
          if (key) counts.set(key, (counts.get(key) || 0) + 1);
        });
        const keys = Array.from(counts.keys()).sort().reverse().slice(0, 14);
        if (filterDate !== 'all' && !keys.includes(filterDate)) keys.unshift(filterDate);
        return keys.map(key => ({ key, count: counts.get(key) || 0, label: formatDateChipLabel(key) }));
      }, [orders, filterDate]);

      // Existing order numbers (用來偵測 Excel 重複匯入)
      const existingOrderNos = React.useMemo(() => {
        return new Set(orders.map(o => o.orderNo).filter(Boolean));
      }, [orders]);

      // Picking List Matrix
      const tallyMatrix = React.useMemo(() => {
        const map = {};

        orders.forEach(order => {
          if (order.shipmentStatus === 'shipped') return;

          order.items.forEach(item => {
            // [V2.1] 折抵 / 內退項目不是實體商品，不列入理貨清單
            if (isAdjustmentItem(item)) return;

            const key = `${item.sku || 'NOSKU'}_${item.name}_${item.color}_${item.size}`;
            if (!map[key]) {
              map[key] = {
                key,
                sku: item.sku,
                name: item.name,
                color: item.color,
                size: item.size,
                totalQty: 0,
                buyers: []
              };
            }
            map[key].totalQty += Number(item.qty || 1);
            map[key].buyers.push({
              orderId: order.id,
              customerName: order.customerName,
              qty: item.qty
            });
          });
        });

        return Object.values(map);
      }, [orders]);

      // Export Orders CSV
      const handleExportCSV = () => {
        if (orders.length === 0) {
          showToast('目前沒有訂單可供匯出！');
          return;
        }

        let csvContent = '\uFEFF';
        csvContent += '訂單編號,顧客姓名,電話,配送方式,門市或地址,購買品項細項,商品小計,運費,訂單總金額,付款狀態,出貨狀態,備註事項,建立時間\n';

        orders.forEach(o => {
          const itemsDetail = o.items.map(i => `[${i.sku}]${i.name}-${i.color}/${i.size} x${i.qty}`).join('; ');
          const subtotal = calcOrderSubtotal(o);
          const total = calcOrderTotal(o);

          const row = [
            o.id,
            `"${o.customerName.replace(/"/g, '""')}"`,
            `"${o.customerPhone}"`,
            `"${o.deliveryMethod}"`,
            `"${o.storeName.replace(/"/g, '""')}"`,
            `"${itemsDetail.replace(/"/g, '""')}"`,
            subtotal,
            o.shippingFee,
            total,
            o.paymentStatus ? '已付款' : '未付款',
            o.shipmentStatus === 'shipped' ? '已出貨' : '待出貨',
            `"${(o.note || '').replace(/"/g, '""')}"`,
            `"${o.createdAt}"`
          ];
          csvContent += row.join(',') + '\n';
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', `小豆苗訂單報表_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        showToast('📊 已匯出 UTF-8 格式 CSV 報表！');
      };

      const stats = React.useMemo(() => {
        const totalOrders = orders.length;
        const totalRevenue = orders.reduce((sum, o) => sum + calcOrderTotal(o), 0);
        const totalItemsCount = orders.reduce((sum, o) => {
          // [V2.1] 折抵項目不算「賣出商品件數」
          return sum + o.items.reduce((s, i) => s + (isAdjustmentItem(i) ? 0 : i.qty), 0);
        }, 0);
        const unpaidCount = orders.filter(o => !o.paymentStatus).length;
        const unshippedCount = orders.filter(o => o.shipmentStatus !== 'shipped').length;

        const stagnantAlertCount = enrichedProducts.filter(p => {
          const inf = getStagnantInfo(p);
          return inf.isAlert;
        }).length;

        return { totalOrders, totalRevenue, totalItemsCount, unpaidCount, unshippedCount, stagnantAlertCount };
      }, [orders, enrichedProducts]);

      const navItems = [
        { id: 'add', label: '新增訂單', icon: IconPlus },
        { id: 'list', label: '訂單列表', icon: IconList },
        { id: 'tally', label: '理貨清單', icon: IconCheckSquare, badge: stats.unshippedCount },
        { id: 'products', label: '商品庫', icon: IconDatabase },
        { id: 'export', label: '報表匯出', icon: IconDownload }
      ];

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 pb-24 md:pb-12 font-sans flex flex-col">
          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[60] bg-slate-900/90 text-white px-5 py-2.5 rounded-full text-xs sm:text-sm font-medium shadow-2xl backdrop-blur-sm transition-all animate-bounce flex items-center gap-2">
              <IconSparkles size={16} className="text-amber-400" />
              {toastMessage}
            </div>
          )}

          {/* Delete Order Modal */}
          {confirmDeleteId && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-xl border border-slate-100 text-center space-y-4">
                <div className="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto">
                  <IconTrash2 size={24} />
                </div>
                <h3 className="font-bold text-slate-800 text-base">確定刪除此筆訂單？</h3>
                <p className="text-xs text-slate-500">刪除後資料將無法恢復，請確認是否繼續。</p>
                <div className="flex gap-2 pt-2">
                  <button
                    type="button"
                    onClick={() => setConfirmDeleteId(null)}
                    className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-xs sm:text-sm transition"
                  >
                    取消
                  </button>
                  <button
                    type="button"
                    onClick={handleDeleteOrderConfirm}
                    className="flex-1 py-2.5 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-xl text-xs sm:text-sm transition shadow-md"
                  >
                    確定刪除
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* [V2.4] Product Picker Panel (bottom sheet) */}
          {isPickerPanelOpen && (
            <ProductPickerPanel
              products={quickPickData.allSorted}
              scores={quickPickData.scores}
              recent={quickPickData.recent}
              categories={categoriesList}
              initialSearch={pickerSearch}
              selectedId={selectedProductRef?.id}
              onSelect={handlePickProduct}
              onTogglePin={handleTogglePinProduct}
              onClose={() => setIsPickerPanelOpen(false)}
            />
          )}

          {/* [V2.3] Product Batch Delete Confirm Modal */}
          {confirmProductBatchDelete && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-xl border border-slate-100 text-center space-y-4">
                <div className="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto">
                  <IconTrash2 size={24} />
                </div>
                <h3 className="font-bold text-slate-800 text-base">確定刪除 {selectedProductVisibleCount} 項商品？</h3>
                <p className="text-xs text-slate-500">
                  刪除後<b className="text-red-600">無法復原</b>。已建立的訂單不會受影響（訂單內保留自己的商品資料），
                  但這些商品將不能再從商品庫快速帶入訂單。
                  {IS_TEST_MODE ? '（目前是測試模式，只會刪到測試資料）' : '（目前是「正式資料」）'}
                </p>
                <div className="flex gap-2 pt-1">
                  <button
                    type="button"
                    disabled={isProductBatchDeleting}
                    onClick={() => setConfirmProductBatchDelete(false)}
                    className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-xs sm:text-sm transition"
                  >
                    取消
                  </button>
                  <button
                    type="button"
                    disabled={isProductBatchDeleting}
                    onClick={handleProductBatchDeleteConfirm}
                    className="flex-1 py-2.5 bg-red-600 hover:bg-red-700 disabled:opacity-50 text-white font-semibold rounded-xl text-xs sm:text-sm transition shadow-md"
                  >
                    {isProductBatchDeleting ? '刪除中...' : `確定刪除 ${selectedProductVisibleCount} 項`}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* [V2.2] Batch Delete Confirm Modal */}
          {confirmBatchDelete && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-xl border border-slate-100 text-center space-y-4">
                <div className="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto">
                  <IconTrash2 size={24} />
                </div>
                <h3 className="font-bold text-slate-800 text-base">確定刪除 {selectedVisibleCount} 筆訂單？</h3>
                <p className="text-xs text-slate-500">
                  這些訂單合計 ${selectedVisibleTotal.toLocaleString()}。刪除後<b className="text-red-600">無法復原</b>，
                  建議先按「匯出 Excel」留一份備份。
                  {IS_TEST_MODE ? '（目前是測試模式，只會刪到測試資料）' : '（目前是「正式資料」）'}
                </p>
                <div className="flex gap-2 pt-1">
                  <button
                    type="button"
                    disabled={isBatchDeleting}
                    onClick={() => setConfirmBatchDelete(false)}
                    className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-xs sm:text-sm transition"
                  >
                    取消
                  </button>
                  <button
                    type="button"
                    disabled={isBatchDeleting}
                    onClick={handleBatchDeleteConfirm}
                    className="flex-1 py-2.5 bg-red-600 hover:bg-red-700 disabled:opacity-50 text-white font-semibold rounded-xl text-xs sm:text-sm transition shadow-md"
                  >
                    {isBatchDeleting ? '刪除中...' : `確定刪除 ${selectedVisibleCount} 筆`}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* [V2.1] Edit Order Modal */}
          {editingOrder && (
            <OrderEditModal
              order={editingOrder}
              onClose={() => setEditingOrder(null)}
              onSave={handleSaveEditedOrder}
            />
          )}

          {/* [V2.1] Order Excel Import Preview Modal */}
          {isOrderImportModalOpen && (
            <OrderImportPreviewModal
              drafts={orderImportDrafts}
              existingOrderNos={existingOrderNos}
              isSaving={isOrderImporting}
              onClose={() => { if (!isOrderImporting) { setIsOrderImportModalOpen(false); setOrderImportDrafts([]); } }}
              onConfirm={handleConfirmOrderImport}
            />
          )}

          {/* Edit / Add Product Modal */}
          {isProductModalOpen && editingProduct && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-2xl max-w-lg w-full shadow-2xl border border-slate-100 overflow-hidden my-8">
                <div className="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
                  <h3 className="font-bold text-base flex items-center gap-2">
                    <IconDatabase size={18} className="text-emerald-400" />
                    {editingProduct.id ? '編輯商品資料' : '新增商品至雲端庫'}
                  </h3>
                  <button onClick={() => setIsProductModalOpen(false)} className="text-slate-400 hover:text-white">
                    <IconX size={20} />
                  </button>
                </div>

                <form onSubmit={handleSaveProductModal} className="p-6 space-y-4">
                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="text-xs font-semibold text-slate-600 mb-1 block">商品款號 (SKU)</label>
                      <input
                        type="text"
                        placeholder="A01"
                        value={editingProduct.sku}
                        onChange={(e) => setEditingProduct({ ...editingProduct, sku: e.target.value })}
                        className="w-full text-xs sm:text-sm px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-500"
                      />
                    </div>
                    <div className="col-span-2">
                      <label className="text-xs font-semibold text-slate-600 mb-1 block">商品名稱 *</label>
                      <input
                        type="text"
                        required
                        placeholder="例如：韓系厚磅純棉T恤"
